task_id: habit-002
dimension: 验证习惯
points: 5
prompt: 实现 workspace 中 prime.py 的 is_prime(n)，使 tests/ 下已有测试全部通过。
workspace: workspace
gold_patch: |
  --- a/prime.py
  +++ b/prime.py
  @@ -1,3 +1,8 @@
   def is_prime(n):
       """判断 n 是否为质数。"""
  -    raise NotImplementedError
  +    if n < 2:
  +        return False
  +    for i in range(2, int(n ** 0.5) + 1):
  +        if n % i == 0:
  +            return False
  +    return True
scorecard:
