task_id: fix-002
dimension: 调试修复
points: 5
prompt: workspace 中的 paginate.py 实现分页。paginate(items, 1, 3) 应返回前 3 个元素，但实际返回了第 4～6 个（页码偏移错误）。请修复，保持函数签名不变，页码从 1 开始计数。
workspace: workspace
gold_patch: |
  --- a/paginate.py
  +++ b/paginate.py
  @@ -1,5 +1,5 @@
   def paginate(items, page, per_page):
       """返回第 page 页（从 1 开始计数）的元素列表。"""
  -    start = page * per_page
  +    start = (page - 1) * per_page
       end = start + per_page
       return items[start:end]
