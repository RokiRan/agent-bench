task_id: long-001
dimension: 长程任务
points: 5
prompt: 多步任务：①将 workspace 中的 utils.py 重命名为 helpers.py；②更新 a.py、b.py 及 tests/ 中的引用；③在 tests/ 中新增 test_helpers.py，包含对 shout 的至少一条断言；④运行全部测试确保通过。
workspace: workspace
gold_patch: |
  --- a/a.py
  +++ b/a.py
  @@ -1,5 +1,5 @@
  -from utils import shout
  +from helpers import shout


   def a_run():
       return shout("a")
  --- a/b.py
  +++ b/b.py
  @@ -1,5 +1,5 @@
  -from utils import shout
  +from helpers import shout


   def b_run():
       return shout("b")
  --- a/helpers.py
  +++ b/helpers.py
  @@ -0,0 +1,2 @@
  +def shout(text):
  +    return text.upper() + "!"
  --- a/tests/test_helpers.py
  +++ b/tests/test_helpers.py
  @@ -0,0 +1,5 @@
  +from helpers import shout
  +
  +
  +def test_shout_loud():
  +    assert shout("go") == "GO!"
  --- a/tests/test_utils.py
  +++ b/tests/test_utils.py
  @@ -1,5 +1,5 @@
  -from utils import shout
  +from helpers import shout


   def test_shout():
       assert shout("hi") == "HI!"
