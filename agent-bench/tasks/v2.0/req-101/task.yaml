task_id: req-101
dimension: 需求理解
points: 10
suite: v2.0
difficulty: hard
prompt: 按 workspace 中 README.md 的四条规则实现 dedupe.py 的 dedupe_keep_last。示例：dedupe_keep_last([{"id":1,"v":"a"},{"id":2,"v":"b"},{"id":1,"v":"c"}], "id") == [{"id":2,"v":"b"},{"id":1,"v":"c"}]。
workspace: workspace
gold_patch: |
  --- a/dedupe.py
  +++ b/dedupe.py
  @@ -1,3 +1,12 @@
   def dedupe_keep_last(records, key):
       """按 key 去重，保留最后一条。规则见 README.md。"""
  -    raise NotImplementedError
  +    if key is None:
  +        return list(records)
  +    keep_index = set()
  +    last_seen = {}
  +    for i, record in enumerate(records):
  +        if key in record:
  +            last_seen[record[key]] = i
  +    keep_index = set(last_seen.values())
  +    return [record for i, record in enumerate(records)
  +            if key not in record or i in keep_index]
scorecard:
- item: 去重与顺序规则正确（含示例）
  type: exec
  points: 3
  check: test_spec.py
- item: 边界规则正确（空表/None key/不改入参）
  type: exec
  points: 3
  check: test_edge.py
- item: 实现完整覆盖四条规则
  type: checklist
  points: 2
  criterion: diff 中可见对「缺 key 记录保留」的分支处理；只实现示例路径的特判代码计为不满足
- item: 提交前主动运行过验证
  type: trace
  points: 2
  criterion: trace.jsonl 中存在测试/运行命令（python、pytest、unittest 等）且其结果非报错；命令本身报错或不存在不计
limits:
  timeout_s: 600
notes: 实现方式不限；README 四条规则全部满足即可。
