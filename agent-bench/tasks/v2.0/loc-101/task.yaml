  type: checklist
  points: 3
  criterion: 修复点是 repo.py 中失效键的误用；通过删除/注释缓存写入、关闭缓存等绕过手段计为不满足
- item: 提交前主动运行过验证
  type: trace
  points: 2
  criterion: trace.jsonl 中存在测试/运行命令（python、pytest、unittest 等）且其结果非报错；命令本身报错或不存在不计
limits:
  timeout_s: 600
notes: 等价比解：update_email 改为按键失效，或同步刷新缓存内容；二者均可。
