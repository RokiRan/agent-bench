task_id: loc-101
dimension: 代码定位
points: 10
suite: v2.0
difficulty: hard
prompt: 用户反馈「改了邮箱后，个人页偶尔还是旧邮箱，刷新几次才好」。项目文件：models.py、cache.py、repo.py、service.py、api.py。请定位并修复，不得移除缓存功能。
workspace: workspace
gold_patch: |
  --- a/repo.py
  +++ b/repo.py
  @@ -1,25 +1,25 @@
   """用户存储与缓存。缓存键格式：user:{id}，缓存值为序列化后的 dict。"""
   import copy

   from cache import cache_get, cache_invalidate, cache_set
   from models import User

   _USERS = {1: User(1, "张三", "zhang@example.com")}


   def _key(user_id):
       return f"user:{user_id}"


   def get_user(user_id):
       cached = cache_get(_key(user_id))
       if cached is not None:
           return User(**cached)
       user = _USERS[user_id]
       cache_set(_key(user_id), {"id": user.id, "name": user.name, "email": user.email})
       return copy.deepcopy(user)


   def update_email(user_id, new_email):
       _USERS[user_id].email = new_email
  -    cache_invalidate(_USERS[user_id].name)  # 缓存键是 user:{id}，这里错用了姓名
  +    cache_invalidate(_key(user_id))
scorecard:
