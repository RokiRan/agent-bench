prompt: 有用户反馈：10 月 5 日（周一）和 10 月 11 日（周日）明明属于同一周，周报系统却分成了两期；跨月交界处也有类似问题。report.py 的 is_same_week 以周一为一周起点，请修复。
workspace: workspace
gold_patch: |
  --- a/report.py
  +++ b/report.py
  @@ -1,8 +1,9 @@
   """周报工具。"""
  +import datetime


   def is_same_week(date_a, date_b):
       """判断两个日期（YYYY-MM-DD）是否在同一自然周（周一为一周开始）。"""
  -    y1, m1, d1 = (int(x) for x in date_a.split("-"))
  -    y2, m2, d2 = (int(x) for x in date_b.split("-"))
  -    return (y1, m1, d1 // 7) == (y2, m2, d2 // 7)
  +    a = datetime.date.fromisoformat(date_a)
  +    b = datetime.date.fromisoformat(date_b)
  +    return a.isocalendar()[:2] == b.isocalendar()[:2]
